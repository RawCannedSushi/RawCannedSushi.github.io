<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <style>
            .pengiuns-img {
                width: 100%;
                height: auto;
                border-radius: 50% / 50%;
                border: 2px solid black;
                filter: sepia(100%)
            }
            .dinosaur-img {
                width: 100%;
                height: auto;
                filter: hue-rotate(100deg)
                drop-shadow(10px 10px 5px rgb(0, 0, 0));
            }   
            .butterfly-img {
                width: 100%;
                height: auto;
                filter: invert(100%);
                opacity: 0.7;
                border-radius:80px 0px 80px 0px;
        
            }
            .seagull-img {
                width: 100%;
                height: auto;
                background: linear-gradient(
                    to bottom right,
                    rgb(138, 146, 255),
                    rgb(255, 255, 255)
                );
                box-shadow: 2px 10px 20px rgba(0, 0, 0, 0.6);
            }  
            .theater-stage-img {
                width: 100%;
                height: auto;
                filter: blur(5px)
            } 
            .container {
                position: relative;
                text-align: center;
                color: white;
            }
            .centered {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                font-family: 'Arial', sans-serif;
                font-size: 25px;
                text-shadow: 3px 3px 3px rgba(0, 0, 0, 1);
            }
            .field-border {
                width: 500px;
                height: 220px;
                object-fit: cover;
                filter: grayscale(100%);
                border: 55px solid transparent;
                border-image-source: url("images/tic-tac-toe.png");
                border-image-slice: 33.33%;
                border-image-repeat: round;
            }
        </style>
    </head>
    <body>
        <img src="images/penguins.jpg" alt="Penguins" class="pengiuns-img">
        <img src="images/dinosaur.png" alt="Dinosaurs" class="dinosaur-img">
        <img src="images/butterfly.jpg" alt="Butterfly" class="butterfly-img">
        <img src="images/seagull.png" alt="Seagull" class="seagull-img">
        <div class="container">
            <img src="images/theater_stage.jpg" alt="Theater Stage" class="theater-stage-img">
            <div class="centered">Presenting</div>
        </div>
        <img class="field-border" src="images/football_field.jpg" alt="Football field with a tic tac toe border">
    </body>
</html>
